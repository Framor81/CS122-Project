<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Personal Museum — Login">
  <title>Personal Museum — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="login-page-308">
    <form class="login-card" onsubmit="event.preventDefault(); window.location.href='homepage-1.html';">
      <p class="brand">MUSEUM</p>
      <h1>Personal Museum</h1>

      <div class="field">
        <label for="login-username">Username</label>
        <input id="login-username" type="text" value="Joey" autocomplete="username">
      </div>

      <div class="field">
        <label for="login-password">Password</label>
        <input id="login-password" type="password" value="StrongPassword!" autocomplete="current-password">
      </div>

      <div class="actions">
        <button type="submit" class="btn btn-primary">Sign In</button>
        <button type="button" class="btn">Create Account</button>
      </div>

      <a class="home-link" href="homepage-2.html">HOME</a>
    </form>
  </div>
</body>
</html>
