<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Personal Museum — Add Artwork">
  <title>Personal Museum — Add Artwork</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="add-images-112">
    <nav class="site-nav">
      <a href="homepage-1.html" class="brand">MUSEUM</a>
      <div class="nav-links">
        <a href="homepage-1.html">HOME</a>
        <a href="collection-all.html">COLLECTION</a>
        <a href="3d-museum.html">3D MUSEUM</a>
      </div>
      <div class="nav-actions">
        <span class="user-chip" id="user-chip"></span>
        <a href="homepage-1.html" class="btn btn-ghost">HOME</a>
        <button type="button" class="btn btn-ghost" id="btn-signout">Sign Out</button>
      </div>
    </nav>

    <section class="upload-wrap">
      <h1>Add Images to your Gallery</h1>

      <label class="dropzone" for="upload-input">
        <img class="upload-icon" src="images/image-2-126.png" alt="Upload icon">
        <p id="dropzone-label">Drag or Click to Upload an Image</p>
        <input id="upload-input" type="file" accept="image/*" hidden>
      </label>

      <p id="upload-status" class="page-status" role="status" aria-live="polite"></p>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="supabase-client.js"></script>
  <script>
    (async function () {
      const user = await museum.requireAuth();
      if (!user) return;

      document.getElementById("user-chip").textContent = user.email || "";
      document
        .getElementById("btn-signout")
        .addEventListener("click", () => museum.signOut());

      const input = document.getElementById("upload-input");
      const status = document.getElementById("upload-status");
      const label = document.getElementById("dropzone-label");

      function say(msg, kind = "info") {
        status.textContent = msg;
        status.dataset.kind = kind;
      }

      input.addEventListener("change", async () => {
        const file = input.files && input.files[0];
        if (!file) return;

        label.textContent = file.name;
        say("Uploading image…");

        try {
          // 1. Upload the image to storage
          const path = await museum.uploadArtworkFile(file, user.id);

          // 2. Insert a pending artworks row
          const { data: art, error: insertErr } = await museum.client
            .from("artworks")
            .insert({ user_id: user.id, image_path: path, status: "pending" })
            .select("id")
            .single();
          if (insertErr) throw insertErr;

          say("Identifying artwork with Claude…");

          // 3. Fire the edge function. It updates the row in place.
          const result = await museum.recognizeArtwork(art.id);
          console.log("recognize result:", result);

          // 4. Hop to the detail page
          window.location.href = `artwork-detail.html?id=${art.id}`;
        } catch (err) {
          console.error(err);
          say(err.message || "Upload failed.", "error");
        }
      });
    })();
  </script>
</body>
</html>
