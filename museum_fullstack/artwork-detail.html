<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Artwork Detail — Personal Museum">
  <title>Artwork — Personal Museum</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="artwork_detail-1-213">
    <nav class="site-nav">
      <a href="homepage-1.html" class="brand">MUSEUM</a>
      <div class="nav-links">
        <a href="homepage-1.html">HOME</a>
        <a href="collection-all.html" class="is-active">YOUR COLLECTION</a>
        <a href="3d-museum.html">3D MUSEUM</a>
      </div>
      <div class="nav-actions">
        <span class="user-chip" id="user-chip"></span>
        <button type="button" class="btn btn-ghost" id="btn-signout">Sign Out</button>
      </div>
    </nav>

    <p id="page-status" class="page-status" role="status" aria-live="polite">Loading…</p>

    <section class="artwork-wrap" id="artwork-body" hidden>
      <div class="artwork-image">
        <img id="art-image" alt="">
      </div>

      <div class="artwork-info">
        <p class="kicker" id="art-kicker"></p>
        <h1 id="art-title"></h1>
        <p class="artist" id="art-artist"></p>

        <div class="artwork-description">
          <h2 class="section-title">Description</h2>
          <p id="art-description"></p>
        </div>

        <div>
          <h2 class="section-title">Details</h2>
          <div class="detail-grid" id="art-details"></div>
        </div>

        <div>
          <h2 class="section-title">Themes</h2>
          <div class="theme-tags" id="art-themes"></div>
        </div>

        <div>
          <h2 class="section-title">Your Caption</h2>
          <textarea
            id="art-caption"
            rows="3"
            placeholder="Write a short caption in your own words…"
            style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:transparent;color:inherit;"
          ></textarea>
          <p id="caption-status" class="page-status" style="text-align:left;padding:4px 0;"></p>
        </div>

        <div class="artwork-actions">
          <button type="button" id="btn-save" class="btn btn-primary">Save Caption</button>
          <a href="collection-all.html" class="btn">Back to Collection</a>
        </div>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="supabase-client.js"></script>
  <script>
    (async function () {
      const user = await museum.requireAuth();
      if (!user) return;

      document.getElementById("user-chip").textContent = user.email || "";
      document
        .getElementById("btn-signout")
        .addEventListener("click", () => museum.signOut());

      const status = document.getElementById("page-status");
      const body = document.getElementById("artwork-body");

      function say(msg, kind = "info") {
        status.textContent = msg;
        status.dataset.kind = kind;
        status.hidden = false;
      }

      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");
      if (!id) {
        say("No artwork id in the URL.", "error");
        return;
      }

      async function render(art) {
        body.hidden = false;
        status.hidden = true;

        const img = document.getElementById("art-image");
        try {
          img.src = await museum.signedImageUrl(art.image_path);
        } catch (e) {
          console.error(e);
        }
        img.alt = art.title || "Artwork";

        const kicker = [art.period, art.date_text].filter(Boolean).join(" · ");
        document.getElementById("art-kicker").textContent = kicker.toUpperCase();
        document.getElementById("art-title").textContent = art.title || "Untitled";
        document.getElementById("art-artist").textContent = art.artist || "Unknown artist";
        document.getElementById("art-description").textContent =
          art.description || "No description available.";

        const grid = document.getElementById("art-details");
        grid.innerHTML = "";
        const rows = [
          ["Medium", art.medium],
          ["Dimensions", art.dimensions],
          ["Date", art.date_text],
          ["Location", art.location_guess],
        ].filter(([, v]) => !!v);
        for (const [k, v] of rows) {
          const kEl = document.createElement("div");
          kEl.className = "label";
          kEl.textContent = k;
          const vEl = document.createElement("div");
          vEl.className = "value";
          vEl.textContent = v;
          grid.appendChild(kEl);
          grid.appendChild(vEl);
        }

        const tags = document.getElementById("art-themes");
        tags.innerHTML = "";
        (art.themes || []).forEach((t) => {
          const s = document.createElement("span");
          s.className = "theme-tag";
          s.textContent = String(t).toUpperCase();
          tags.appendChild(s);
        });

        document.getElementById("art-caption").value = art.caption || "";
      }

      async function load() {
        const { data: art, error } = await museum.client
          .from("artworks")
          .select("*")
          .eq("id", id)
          .single();
        if (error || !art) {
          say(error ? error.message : "Artwork not found.", "error");
          return null;
        }
        return art;
      }

      // Initial load. If the row is still pending, poll until it's ready.
      let art = await load();
      if (!art) return;

      if (art.status === "pending") {
        say("Claude is still analyzing this image…");
        for (let i = 0; i < 30; i++) {
          await new Promise((r) => setTimeout(r, 1500));
          art = await load();
          if (!art || art.status !== "pending") break;
        }
      }

      if (!art) return;
      if (art.status === "error") {
        say("AI analysis failed: " + (art.error_message || "unknown error"), "error");
        return;
      }

      await render(art);

      // Save the user's caption
      const captionEl = document.getElementById("art-caption");
      const captionStatus = document.getElementById("caption-status");
      document.getElementById("btn-save").addEventListener("click", async () => {
        captionStatus.textContent = "Saving…";
        captionStatus.dataset.kind = "info";
        const { error } = await museum.client
          .from("artworks")
          .update({ caption: captionEl.value })
          .eq("id", id);
        if (error) {
          captionStatus.textContent = error.message;
          captionStatus.dataset.kind = "error";
        } else {
          captionStatus.textContent = "Saved.";
        }
      });
    })();
  </script>
</body>
</html>
