<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Your Collection — Personal Museum">
  <title>Your Collection — Personal Museum</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="collection-all-130">
    <nav class="site-nav">
      <a href="homepage-1.html" class="brand">MUSEUM</a>
      <div class="nav-links">
        <a href="homepage-1.html">HOME</a>
        <a href="collection-all.html" class="is-active">COLLECTION</a>
        <a href="/">3D MUSEUM</a>
      </div>
      <div class="nav-actions">
        <span class="user-chip" id="user-chip"></span>
        <a href="add-images.html" class="add-artwork-180 btn">+ Add Artwork</a>
        <button type="button" class="btn btn-ghost" id="btn-signout">Sign Out</button>
      </div>
    </nav>

    <section class="collection-header">
      <p class="eyebrow">YOUR COLLECTION</p>
      <h1>All Works</h1>
    </section>

    <nav class="collection-filters" id="filters">
      <span class="is-active" data-filter="ALL">ALL</span>
    </nav>

    <p id="status" class="page-status" role="status" aria-live="polite">Loading your collection…</p>

    <section class="artwork-grid" id="grid" hidden></section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="supabase-client.js"></script>
  <script>
    (async function () {
      const user = await museum.requireAuth();
      if (!user) return;

      document.getElementById("user-chip").textContent = user.email || "";
      document
        .getElementById("btn-signout")
        .addEventListener("click", () => museum.signOut());

      const status = document.getElementById("status");
      const grid = document.getElementById("grid");
      const filters = document.getElementById("filters");

      function say(msg, kind = "info") {
        status.textContent = msg;
        status.dataset.kind = kind;
        status.hidden = false;
      }

      const { data: artworks, error } = await museum.client
        .from("artworks")
        .select("id, title, artist, date_text, themes, image_path, status")
        .eq("user_id", user.id)
        .order("created_at", { ascending: false });

      if (error) {
        say(error.message, "error");
        return;
      }

      if (!artworks || artworks.length === 0) {
        say("No artworks yet. Click + Add Artwork to upload your first.");
        return;
      }

      // Collect theme tags for the filter row
      const themeSet = new Set();
      for (const a of artworks) {
        (a.themes || []).forEach((t) => themeSet.add(String(t).toUpperCase()));
      }
      for (const t of [...themeSet].sort()) {
        const el = document.createElement("span");
        el.dataset.filter = t;
        el.textContent = t;
        filters.appendChild(el);
      }

      // Resolve signed URLs (one call per image — fine at prototype scale)
      const cards = await Promise.all(
        artworks.map(async (a) => {
          let url = "";
          try {
            url = await museum.signedImageUrl(a.image_path);
          } catch (e) {
            console.warn("signed url failed for", a.image_path, e);
          }
          return { ...a, url };
        })
      );

      function render(filter) {
        grid.innerHTML = "";
        const visible = cards.filter((a) => {
          if (filter === "ALL") return true;
          const themes = (a.themes || []).map((t) => String(t).toUpperCase());
          return themes.includes(filter);
        });

        if (visible.length === 0) {
          grid.hidden = true;
          say("No artworks match this filter.");
          return;
        }
        status.hidden = true;
        grid.hidden = false;

        for (const a of visible) {
          const link = document.createElement("a");
          link.href = `artwork-detail.html?id=${a.id}`;
          link.className = "prototype-link";

          const card = document.createElement("div");
          card.className = "group-1-141";

          const thumb = document.createElement("div");
          thumb.className = "art-thumb";
          if (a.url) thumb.style.backgroundImage = `url("${a.url}")`;
          thumb.style.backgroundSize = "cover";
          thumb.style.backgroundPosition = "center";

          const title = document.createElement("p");
          title.className = "meta-title";
          title.textContent =
            a.title || (a.status === "pending" ? "Identifying…" : "Untitled");

          const sub = document.createElement("p");
          sub.className = "meta-sub";
          const artist = a.artist || "Unknown";
          const when = a.date_text ? ` · ${a.date_text}` : "";
          sub.textContent = `${artist}${when}`;

          card.appendChild(thumb);
          card.appendChild(title);
          card.appendChild(sub);
          link.appendChild(card);
          grid.appendChild(link);
        }
      }

      render("ALL");

      filters.addEventListener("click", (e) => {
        const target = e.target.closest("[data-filter]");
        if (!target) return;
        [...filters.children].forEach((el) => el.classList.remove("is-active"));
        target.classList.add("is-active");
        render(target.dataset.filter);
      });
    })();
  </script>
</body>
</html>
