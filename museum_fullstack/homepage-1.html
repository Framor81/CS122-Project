<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Personal Museum — Welcome">
  <title>Personal Museum — Welcome</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="homepage-1-1">
    <nav class="site-nav">
      <a href="homepage-1.html" class="brand">MUSEUM</a>
      <div class="nav-links">
        <a href="homepage-1.html" class="is-active">HOME</a>
        <a href="collection-all.html">COLLECTION</a>
        <a href="3d-museum.html">3D MUSEUM</a>
      </div>
      <div class="nav-actions">
        <span class="user-chip" id="user-chip"></span>
        <a href="add-images.html" class="btn">+ Add Artwork</a>
        <button type="button" class="btn btn-ghost" id="btn-signout">Sign Out</button>
      </div>
    </nav>

    <section class="hero">
      <p class="eyebrow">Welcome</p>
      <h1>
        Welcome to Your <span class="accent">Personal Museum</span><span id="hero-name">!</span>
      </h1>
      <p class="explore-label">EXPLORE</p>
    </section>

    <section class="card-grid">
      <a href="collection-all.html" class="prototype-link">
        <article class="collection-button-20 feature-card">
          <span class="card-kicker">Curated</span>
          <h2>Your Collection</h2>
          <p>Browse and revisit every artwork you've discovered.</p>
          <span class="card-action">ENTER →</span>
        </article>
      </a>

      <a href="3d-museum.html" class="prototype-link">
        <article class="3d-museum-button-29 feature-card">
          <span class="card-kicker">Immersive Experience</span>
          <h2>3D Museum</h2>
          <p>Walk through a virtual gallery of your saved works.</p>
          <span class="card-action">ENTER →</span>
        </article>
      </a>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="supabase-client.js"></script>
  <script>
    (async function () {
      const user = await museum.requireAuth();
      if (!user) return;

      const display = (user.email || "").split("@")[0];
      document.getElementById("user-chip").textContent = user.email || "";
      document.getElementById("hero-name").textContent = display ? `, ${display}!` : "!";
      document
        .getElementById("btn-signout")
        .addEventListener("click", () => museum.signOut());
    })();
  </script>
</body>
</html>
